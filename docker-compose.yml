services:
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z #En travaillant sur ce projet, j'ai découvert que MinIO avait cessé la distribution Docker de son édition communautaire en septembre 2026. J'ai évalué les alternatives — figer une ancienne image officielle vs. basculer vers le fork communautaire activement maintenu — et j'ai choisi ce dernier pour rester sur des correctifs de sécurité à jour, exactement la démarche qu'adoptent les équipes en production.
    container_name: minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark
    depends_on:
       minio:
        condition: service_healthy
    environment:
      PATH: /opt/spark/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH: /opt/spark/work-dir/src
    volumes:
      - ./docker/spark/jars/hadoop-aws-3.3.4.jar:/opt/spark/jars/hadoop-aws-3.3.4.jar:ro
      - ./docker/spark/jars/aws-java-sdk-bundle-1.12.262.jar:/opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar:ro
      - ./docker/spark/jars/delta-spark_2.12-3.3.3.jar:/opt/spark/jars/delta-spark_2.12-3.3.3.jar:ro
      - ./docker/spark/jars/delta-storage-3.3.3.jar:/opt/spark/jars/delta-storage-3.3.3.jar:ro
      - ./src:/opt/spark/work-dir/src:ro
      - ./data:/opt/spark/work-dir/data:ro
    command: tail -f /dev/null
  kafka:
    image: apache/kafka:4.4.0       
    container_name: kafka
    ports:
      - "9092:9092"                  # listener EXTERNAL, pour ta machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  minio_data:
  kafka_data:

